[workspace]
members = ["contracts/*"]
resolver = "2"

[workspace.package]
authors = ["Juliana Sanabria Bravo"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/julissb51-cell/crypto-cantina"
version = "0.1.0"

[workspace.dependencies]
soroban-sdk = "26.1.0"

[profile.release]
opt-level = "z"
debug = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[profile.release-with-logs]
debug-assertions = true
inherits = "release"
